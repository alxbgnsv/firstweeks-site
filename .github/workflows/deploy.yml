name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enables GitHub Pages (Actions source) on the first run — no manual
      # Settings → Pages click needed. Falls back gracefully if already enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No runtime deps — WebP/OG images are pre-generated and committed, so the
      # build is pure Node. --omit=dev skips sharp/lighthouse (dev-only).
      - run: npm ci --omit=dev
      - run: npm run build
      # public/CNAME is copied into dist/ by the build, so Pages keeps the custom
      # domain on every deploy. Fail loudly if it's ever missing.
      - run: test -f dist/CNAME && grep -qx 'firstweeks.app' dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
